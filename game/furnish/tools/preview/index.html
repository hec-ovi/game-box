<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>furnish preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #06080a;
        overflow: hidden;
        font: 12px/1.4 ui-monospace, monospace;
        color: #cfe6ef;
      }
      canvas {
        display: block;
      }
      #cost {
        position: fixed;
        left: 10px;
        top: 10px;
        padding: 6px 9px;
        background: #0b0f13cc;
        white-space: pre;
      }
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #labels span {
        position: absolute;
        transform: translate(-50%, 0);
        color: #9fd8e8;
        text-shadow: 0 0 4px #000;
      }
    </style>
  </head>
  <body>
    <div id="cost"></div>
    <div id="labels"></div>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
