[package]
name = "gb-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "game-box"
path = "src/main.rs"

[dependencies]
gb-llm = { path = "../llm" }
gb-stt = { path = "../stt" }
serde_json = { workspace = true }
jsonschema = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
axum = { version = "0.8", features = ["ws"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.24"
base64 = "0.22"
